    <style>
        body { margin: 0; background: #111; color: white; font-family: sans-serif; overflow: hidden; }
        
        /* Two full-screen viewport containers */
        #map-container, #viewer-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        #viewer, #openseadragon-viewer {
            width: 100%;
            height: 100%;
            background: #000;
        }
        
        /* Floating Back to Map Button */
        #back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            padding: 12px 20px;
            background: #2c3e50;
            color: white;
            border: 2px solid #34495e;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: background 0.2s, transform 0.1s;
        }

        #back-button:hover {
            background: #34495e;
            transform: translateY(-1px);
        }

        #back-button:active {
            transform: translateY(1px);
        }

        /* Interactive marker pins on the Site Plan */
        .annotation-marker {
            background: rgba(31, 117, 53, 0.8); /* dark green */
            border: 2px solid white;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            color: white;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            line-height: 28px;
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            /* Keep bottom-center of the marker pinned to the coordinate */
            transform-origin: center bottom; 
        }
        
        .annotation-marker .popup-info {
            display: none;
            position: absolute;
            bottom: 36px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid #444;
            color: white;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 14px;
            width: 260px;
            white-space: normal;
            z-index: 100;
        }

        .annotation-marker.open .popup-info {
            display: block;
        }

        .scan-credit-panel { display: flex !important; flex-direction: column;
            align-items: flex-end; gap: 6px; margin: 0; }
        .scan-credit-panel .navigator { margin: 0 !important; }
        .scan-credits { padding: 7px 10px; background: rgba(0,0,0,.75);
            color: #ddd; border-radius: 4px; font-size: 11px;
            line-height: 1.5; text-align: right; white-space: nowrap; }
        .mask-editor { margin: 12px; padding: 12px; background: #18212a;
            border: 1px solid #647486; border-radius: 6px; color: white;
            width: 300px; max-width: calc(100vw - 48px); font-size: 13px; }
        .mask-editor button { padding: 7px; margin: 3px; cursor: pointer; }
        .mask-editor p { margin: 8px 0; line-height: 1.4; }
        #openseadragon-viewer.mask-tracing .annotation-marker { visibility: hidden; }
    </style>
</head>

            function summary() {

            function area(poly) {
                return poly.reduce((sum, p, i) => {

            function onSegment(a,b,p) {
                return Math.abs(cross(a,b,p)) < 1e-7 &&
                    p.x >= Math.min(a.x,b.x)-1e-7 && p.x <= Math.max(a.x,b.x)+1e-7 &&

            }
            function contains(outer, inner) {
                return inner.every(p=>inside(p,outer)) && !boundariesMeet(outer,inner);
            }
            function validSimple(poly) {
                if(poly.length<3 || Math.abs(area(poly))<0.01) return false;
                for(let i=0;i<poly.length;i++) {
                    const ni=(i+1)%poly.length;
                    if(Math.hypot(poly[i].x-poly[ni].x,poly[i].y-poly[ni].y)<0.01) return false;
                    for(let j=i+1;j<poly.length;j++) {
                        const nj=(j+1)%poly.length;
                        if(j===ni || nj===i) continue;
                        if(intersects(poly[i],poly[ni],poly[j],poly[nj])) return false;
                    }
                }
                return true;
            }
            function validateDraft() {
                if(!validSimple(points)) return "Use at least three distinct points, in order, without crossing the outline.";
                if(mode==="outer") {
                    if(holes().some(h=>!contains(points,h)))
                        return "The new wall outline would cut across a kept opening. Cancel edits or remove that opening first.";
                    return "";
                }
                const outer=reliefMasks[activeDziPath];
                if(!outer || !contains(outer,points))
                    return "Keep the opening fully inside the wall outline. It must not touch or cross the outer boundary.";
                if(holes().some(h=>boundariesMeet(points,h) || inside(points[0],h) || inside(h[0],points)))
                    return "This opening overlaps or touches a kept cutout. Cancel edits, or undo the last kept cutout first.";
                return "";
            }
            function displayShape() {
                let outer=reliefMasks[activeDziPath], cutouts=holes();
                if(tracing && mode==="outer") return {outer:null, cutouts:[]};
                if(previewing) {
                    if(mode==="outer") outer=points;
                    else cutouts=cutouts.concat([points]);
                }
                return {outer,cutouts};
            }
            function cropItem(item) {
                if(!item) return;
                const shape=displayShape();
                if(!shape.outer || shape.outer.length<3) { item.resetCroppingPolygons(); return; }
                // OpenSeadragon 4.1 uses the non-zero winding rule:
                // outer and opening paths must have opposite directions.
                item.setCroppingPolygons([
                    winding(shape.outer,true), ...shape.cutouts.map(h=>winding(h,false))
                ]);
            }
            function applyCrop() {
                cropItem(scanViewer.world.getItemAt(0));
                cropItem(scanViewer.navigator.world.getItemAt(0));
                scanViewer.forceRedraw(); scanViewer.navigator.forceRedraw();
            }
            function setTracing(value) {
                tracing=value; host.classList.toggle("mask-tracing",value);
            }
            function drawGuide() {
                guide.replaceChildren();
                if(!tracing || !points.length) return;
                const item=scanViewer.world.getItemAt(0);
                if(!item) return;
                const color=mode==="cutout" ? "#ffb347" : "#00ffff";
                const pixels=points.map(p=>scanViewer.viewport.pixelFromPoint(
                    item.imageToViewportCoordinates(new OpenSeadragon.Point(p.x,p.y)),true));
                const line=document.createElementNS(svgNS,"polyline");
                line.setAttribute("points",pixels.map(p=>p.x+","+p.y).join(" "));
                line.setAttribute("fill","none"); line.setAttribute("stroke",color);
                line.setAttribute("stroke-width","2"); guide.appendChild(line);
                pixels.forEach((p,i)=>{
                    const dot=document.createElementNS(svgNS,"circle");
                    dot.setAttribute("cx",p.x); dot.setAttribute("cy",p.y);
                    dot.setAttribute("r","4"); dot.setAttribute("fill",color); guide.appendChild(dot);
                    const label=document.createElementNS(svgNS,"text");
                    label.setAttribute("x",p.x+7); label.setAttribute("y",p.y-7);
                    label.setAttribute("fill","white"); label.setAttribute("font-size","12");
                    label.setAttribute("stroke","black"); label.setAttribute("stroke-width","3");
                    label.setAttribute("paint-order","stroke"); label.textContent=i+1; guide.appendChild(label);
                });
            }
            function resetDraft() {
                points=[]; previewing=false; setTracing(false); drawGuide(); applyCrop();
            }
            function begin(kind) {
                if(!scanViewer.world.getItemAt(0)) return;
                if(kind==="cutout" && !reliefMasks[activeDziPath]) {
                    setStatus("Keep an outer wall outline before adding an opening."); return;
                }
                if((tracing || previewing) && !confirm("Discard the current draft and start again?")) return;
                if(kind==="outer" && reliefMasks[activeDziPath] &&
                    !confirm("Redraw this wall's OUTER outline? Use Cut out opening for doorways instead.")) return;
                mode=kind; points=[]; previewing=false; setTracing(true); applyCrop(); drawGuide();
                setStatus(kind==="cutout" ?
                    "CUTOUT: trace around the inside of the doorframe. Everything enclosed will be hidden." :
                    "OUTER OUTLINE: trace around the wall. Everything enclosed will be kept.");
            }
            function exportPage() {
                if(tracing || previewing) {
                    setStatus("Click Keep cutout / Keep outline, or Cancel edits, before downloading."); return;
                }
                const encode=data=>JSON.stringify(data).replace(/</g,"\\u003c");
                let output=maskPageTemplate.replace(
                    /(<script id="relief-masks" type="application\/json">)[\s\S]*?(<\/script>)/,
                    (_,start,end)=>start+encode(reliefMasks)+end);
                output=output.replace(
                    /(<script id="relief-cutouts" type="application\/json">)[\s\S]*?(<\/script>)/,
                    (_,start,end)=>start+encode(reliefCutouts)+end);
                const url=URL.createObjectURL(new Blob([output],{type:"text/html;charset=utf-8"}));
                const a=document.createElement("a"); a.href=url; a.download="banteay-chhmar-cleaned.html"; a.click();
                setTimeout(()=>URL.revokeObjectURL(url),1000);
                dirty=false;
                setStatus("Download created with ALL kept wall outlines and opening cutouts.");
            }
            if(maskEditMode) {
                const panel=document.createElement("div"); panel.className="mask-editor";
                const heading=document.createElement("strong"); heading.textContent="Wall and opening editor";
                panel.appendChild(heading);
                const help=document.createElement("p");
                help.textContent="Cut out opening hides the enclosed area. Outer wall outlines stay intact. Scroll to zoom; drag to move.";
                panel.appendChild(help);
                function button(label,action) {
                    const b=document.createElement("button"); b.type="button"; b.textContent=label;
                    b.addEventListener("click",action); panel.appendChild(b);
                }
                button("Cut out opening",()=>begin("cutout"));
                button("Undo point",()=>{
                    if(!tracing && !previewing) return;
                    previewing=false; setTracing(true); points.pop(); applyCrop(); drawGuide();
                    setStatus(points.length+" points. Continue tracing.");
                });
                button("Preview",()=>{
                    if(!tracing && !previewing) { setStatus("Click Cut out opening first."); return; }
                    const error=validateDraft(); if(error) { setStatus(error); return; }
                    setTracing(false); previewing=true; drawGuide(); applyCrop();
                    setStatus(mode==="cutout" ?
                        "Preview only. Click Keep cutout to accept, or Continue tracing to adjust." :
                        "Preview only. Click Keep outline to accept.");
                });
                button("Continue tracing",()=>{
                    if(!previewing) return;
                    previewing=false; setTracing(true); applyCrop(); drawGuide();
                    setStatus("Continue adding points, or use Undo point.");
                });
                function keep(kind) {
                    if(!previewing || mode!==kind) {
                        setStatus(kind==="cutout" ? "Preview an opening cutout first." : "Preview an outer outline first."); return;
                    }
                    if(kind==="cutout") {
                        if(!reliefCutouts[activeDziPath]) reliefCutouts[activeDziPath]=[];
                        reliefCutouts[activeDziPath].push(clone(points));
                    } else reliefMasks[activeDziPath]=clone(points);
                    dirty=true; resetDraft(); summary();
                }
                button("Keep cutout",()=>keep("cutout"));
                button("Cancel edits",()=>{resetDraft(); summary();});
                button("Undo last kept cutout",()=>{
                    if(tracing || previewing) { setStatus("Cancel or keep the current draft first."); return; }
                    if(!holes().length) { setStatus("No opening cutouts to undo on this elevation."); return; }
                    if(!confirm("Remove the most recently kept opening cutout on this elevation?")) return;
                    reliefCutouts[activeDziPath].pop(); dirty=true; applyCrop(); summary();
                });
                button("Download HTML",exportPage);
                const outerDetails=document.createElement("details");
                const outerSummary=document.createElement("summary");
                outerSummary.textContent="Outer wall outline controls";
                outerDetails.appendChild(outerSummary); panel.appendChild(outerDetails);
                const outerStart=panel.children.length;
                button("Redraw outer outline",()=>begin("outer"));
                button("Keep outline",()=>keep("outer"));
                while(panel.children.length>outerStart) outerDetails.appendChild(panel.children[outerStart]);
                status=document.createElement("p"); status.setAttribute("role","status"); panel.appendChild(status);
                scanViewer.addControl(panel,{anchor:OpenSeadragon.ControlAnchor.TOP_RIGHT,autoFade:false});
                window.addEventListener("beforeunload",e=>{
                    if(dirty || tracing || previewing) {e.preventDefault(); e.returnValue="";}
                });
            }
            scanViewer.addHandler("canvas-click",e=>{
                if(!tracing || !e.quick) return;
                e.preventDefaultAction=true;
                const item=scanViewer.world.getItemAt(0); if(!item) return;
                const p=item.viewportToImageCoordinates(scanViewer.viewport.pointFromPixel(e.position,true));
                const size=item.getContentSize();
                if(p.x<0 || p.y<0 || p.x>size.x || p.y>size.y) {setStatus("Click inside the image area."); return;}
                const point={x:Math.round(p.x*100)/100,y:Math.round(p.y*100)/100};
                if(points.length && Math.hypot(point.x-points[points.length-1].x,point.y-points[points.length-1].y)<0.01) return;
                points.push(point); drawGuide();
                setStatus(points.length+" points. "+(mode==="cutout" ? "Enclosed area will be hidden." : "Enclosed area will be kept.")+" Click Preview when finished.");
            });
            scanViewer.addHandler("canvas-double-click",e=>{if(tracing)e.preventDefaultAction=true;});
            scanViewer.addHandler("animation",drawGuide); scanViewer.addHandler("resize",drawGuide);
            scanViewer.addHandler("open",()=>{resetDraft(); summary();});
            scanViewer.navigator.addHandler("open",()=>{
                cropItem(scanViewer.navigator.world.getItemAt(0)); scanViewer.navigator.forceRedraw();
            });
            scanViewer.addHandler("close",()=>{
                points=[]; previewing=false; setTracing(false); drawGuide();
            });
        }


        // Click helper for plotting coordinates
        viewer.addHandler('canvas-click', function(event) {
            if (event.quick) {
                const viewportPoint = viewer.viewport.pointFromPixel(event.position);
                console.log(`Site Plan Coords -> X: ${viewportPoint.x.toFixed(4)}, Y: ${viewportPoint.y.toFixed(4)}`);
            }
        });
    </script></body></html>
